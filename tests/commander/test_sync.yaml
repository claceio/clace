config:
  env:
    CL_CONFIG_FILE: openrun.toml
    GOCOVERDIR: ${GOCOVERDIR}/../client
    PATH: ${PATH}
tests:
  sync0001: ## setup
    command: ../openrun sync schedule --approve --promote --verify github.com/openrundev/openrun/examples/utils.star
    stdout: "Sync job created with Id"
  sync0010:
    command: ../openrun sync list
    stdout:
      line-count: 2
      contains:
        - "examples/utils.star"
  sync0020:
    command: ../openrun sync list -f json | jq -r '.[0].id' > sync_test_id.tmp
  sync0021:
    command: ../openrun sync list -f json | jq -r '.[0].metadata.verify'
    stdout: "true"
  sync0030:
    command: sh -c 'id=$(cat sync_test_id.tmp); ../openrun sync run "$id"'
    stdout: "0 app(s) created, 0 app(s) updated, 2 app(s) reloaded, 6 app(s) skipped, 0 app(s) approved, 1 app(s) promoted" # proxy app is always reloaded because there is no source to check against
  sync0040:
    command: ../openrun app delete /utils/disk_usage
    exit-code: 0
  sync0050:
    command: sh -c 'id=$(cat sync_test_id.tmp); ../openrun sync run "$id"'
    stdout: "1 app(s) created, 0 app(s) updated, 2 app(s) reloaded, 5 app(s) skipped, 0 app(s) approved, 1 app(s) promoted"
  sync0060:
    command: sh -c 'id=$(cat sync_test_id.tmp); ../openrun sync delete "$id"'
    stdout: "deleted"
  sync0070:
    command: ../openrun sync list
    stdout:
      line-count: 1
  sync0080: ## setup non-verify sync job
    command: ../openrun sync schedule --approve --promote github.com/openrundev/openrun/examples/utils.star
    stdout: "Sync job created with Id"
  sync0090:
    command: ../openrun sync list
    stdout:
      line-count: 2
      contains:
        - "examples/utils.star"
  sync0091:
    command: ../openrun sync list -f json | jq -r '.[0].metadata.verify'
    stdout: "false"
  sync0092:
    command: ../openrun sync list -f json | jq -r '.[0].id' > sync_test_id.tmp
  sync0093:
    command: sh -c 'id=$(cat sync_test_id.tmp); ../openrun sync run "$id"'
    stdout: "0 app(s) created, 0 app(s) updated, 2 app(s) reloaded, 6 app(s) skipped, 0 app(s) approved, 1 app(s) promoted"
  sync0094:
    command: sh -c 'id=$(cat sync_test_id.tmp); ../openrun sync delete "$id"'
    stdout: "deleted"
  sync0100:
    command: ../openrun sync list
    stdout:
      line-count: 1

  ## --- prune: a sync created with --prune deletes the apps and bindings it
  ## created that are no longer declared; resources created imperatively and
  ## later adopted by the sync are never pruned
  sync0200: # setup: app source, sqlite service and a declaration with two apps, one binding and one pre-existing app
    command: rm -rf /tmp/prunetestapp /tmp/prune_sync.ace && cp -r ./testapp /tmp/prunetestapp && ../openrun service create sqlite/prunesvc && printf 'app("/prune/app1", "/tmp/prunetestapp", stage_at="path")\napp("/prune/app2", "/tmp/prunetestapp", stage_at="path")\napp("/prune/manual", "/tmp/prunetestapp", stage_at="path")\nbinding("/prune/bind1", "sqlite/prunesvc")\n' > /tmp/prune_sync.ace
  sync0201: # created imperatively; the sync adopts it below but must never prune it
    command: ../openrun app create --stage-at path /tmp/prunetestapp /prune/manual
  sync0202: # first run creates the declared resources and stamps them as sync-created
    command: ../openrun sync schedule --prune /tmp/prune_sync.ace
    stdout:
      contains:
        - "2 app(s) created"
        - "0 app(s) pruned, 0 binding(s) pruned"
        - "Sync job created with Id"
  sync0203:
    command: ../openrun sync list -f json | jq -r '.[0].id' > prune_sync_id.tmp
  sync0204: # drop app2, the binding and the adopted app from the declaration
    command: printf 'app("/prune/app1", "/tmp/prunetestapp", stage_at="path")\n' > /tmp/prune_sync.ace
  sync0205: # the sync prunes only what it created; the adopted app is kept
    command: sh -c 'id=$(cat prune_sync_id.tmp); ../openrun sync run "$id"'
    stdout:
      contains:
        - "Pruned apps: /prune/app2"
        - "Pruned bindings: /prune/bind1"
        - "1 app(s) pruned, 1 binding(s) pruned"
  sync0206: # app2 is gone; app1 and the adopted app remain
    command: ../openrun app list -f json "/prune/*" | jq -r '[.[].path] | sort | join(",")'
    stdout: "/prune/app1,/prune/manual"
  sync0207: # the pruned binding is gone
    command: ../openrun binding list -f json | jq -r '[.[].path | select(. == "/prune/bind1")] | length'
    stdout: "0"
  sync0208: # a run with no declaration change prunes nothing
    command: sh -c 'id=$(cat prune_sync_id.tmp); ../openrun sync run "$id"'
    stdout: "0 app(s) pruned, 0 binding(s) pruned"
  sync0210: # cleanup
    command: sh -c 'id=$(cat prune_sync_id.tmp); ../openrun sync delete "$id" && rm -f prune_sync_id.tmp'
    stdout: "deleted"
  sync0211:
    command: ../openrun app delete "/prune/*" && ../openrun service delete sqlite/prunesvc && rm -rf /tmp/prunetestapp /tmp/prune_sync.ace
    stdout: "app(s) deleted"

  ## --- #109: a scheduled sync (default --reload=matched) saves a declaration
  ## only change when the app's repo has no new commit, and the next run finds
  ## nothing to update
  sync0300: # setup: the first run creates the git app with its param
    command: >-
      printf 'app("/sync109/app", "github.com/openrundev/apps/system/disk_usage", stage_at="path", params={"CONFIG_ONLY_TEST": "1"})\n' > /tmp/sync_109.ace && ../openrun sync schedule --approve --promote /tmp/sync_109.ace
    stdout:
      contains:
        - "1 app(s) created"
        - "Sync job created with Id"
  sync0301:
    command: ../openrun sync list -f json | jq -r '.[] | select(.path == "/tmp/sync_109.ace") | .id' > sync109_id.tmp
  sync0302: # change only the param: both copies are updated, nothing is skipped
    command: >-
      printf 'app("/sync109/app", "github.com/openrundev/apps/system/disk_usage", stage_at="path", params={"CONFIG_ONLY_TEST": "2"})\n' > /tmp/sync_109.ace && sh -c 'id=$(cat sync109_id.tmp); ../openrun sync run "$id"'
    stdout:
      contains:
        - "Updated apps: /sync109/app_cl_stage, /sync109/app"
        - "0 app(s) created, 2 app(s) updated, 0 app(s) reloaded, 0 app(s) skipped, 0 app(s) approved, 1 app(s) promoted"
  sync0303: # the param reached the prod app
    command: ../openrun param list /sync109/app
    stdout: "CONFIG_ONLY_TEST: 2"
  sync0304: # the next run finds no difference
    command: sh -c 'id=$(cat sync109_id.tmp); ../openrun sync run "$id"'
    stdout: "0 app(s) created, 0 app(s) updated, 0 app(s) reloaded, 1 app(s) skipped"
  sync0305: # cleanup
    command: sh -c 'id=$(cat sync109_id.tmp); ../openrun sync delete "$id" && rm -f sync109_id.tmp'
    stdout: "deleted"
  sync0306:
    command: ../openrun app delete /sync109/app && rm -f /tmp/sync_109.ace
    stdout: "app(s) deleted"

  ## --- #111: a sync deleted and scheduled again claims the apps it finds up
  ## to date, so the console lists them under the new entry instead of as
  ## unmanaged
  sync0400: # setup: the first run creates the git app
    command: >-
      printf 'app("/sync111/app", "github.com/openrundev/apps/system/disk_usage", stage_at="path")\n' > /tmp/sync_111.ace && ../openrun sync schedule --approve --promote /tmp/sync_111.ace
    stdout:
      contains:
        - "1 app(s) created"
        - "Sync job created with Id"
  sync0401:
    command: ../openrun sync list -f json | jq -r '.[] | select(.path == "/tmp/sync_111.ace") | .id' > sync111_id.tmp
  sync0402: # the stage app records the sync that created it
    command: >-
      sh -c 'id=$(cat sync111_id.tmp); got=$(../openrun app list -i -f json "/sync111/*" | jq -r ".[] | select(.path == \"/sync111/app_cl_stage\") | .metadata.applied_sync_id"); [ -n "$id" ] && [ "$got" = "$id" ] && echo "stage-sync-id-current" || echo "stage-sync-id-STALE: $got vs $id"'
    stdout: "stage-sync-id-current"
  sync0403: # replace the sync: delete it and schedule the same file again
    command: sh -c 'id=$(cat sync111_id.tmp); ../openrun sync delete "$id"'
    stdout: "deleted"
  sync0404: # the new entry finds the app up to date
    command: ../openrun sync schedule --approve --promote /tmp/sync_111.ace
    stdout:
      contains:
        - "0 app(s) created, 0 app(s) updated, 0 app(s) reloaded, 1 app(s) skipped"
        - "Sync job created with Id"
  sync0405: # the new entry has a different id
    command: >-
      sh -c 'old=$(cat sync111_id.tmp); ../openrun sync list -f json | jq -r ".[] | select(.path == \"/tmp/sync_111.ace\") | .id" > sync111_id.tmp; new=$(cat sync111_id.tmp); [ -n "$new" ] && [ "$new" != "$old" ] && echo "sync-id-replaced" || echo "sync-id-SAME: $new"'
    stdout: "sync-id-replaced"
  sync0406: # the skipped app now carries the new entry's id
    command: >-
      sh -c 'id=$(cat sync111_id.tmp); got=$(../openrun app list -i -f json "/sync111/*" | jq -r ".[] | select(.path == \"/sync111/app_cl_stage\") | .metadata.applied_sync_id"); [ -n "$id" ] && [ "$got" = "$id" ] && echo "stage-sync-id-current" || echo "stage-sync-id-STALE: $got vs $id"'
    stdout: "stage-sync-id-current"
  sync0407: # a later run still skips the app
    command: sh -c 'id=$(cat sync111_id.tmp); ../openrun sync run "$id"'
    stdout: "0 app(s) created, 0 app(s) updated, 0 app(s) reloaded, 1 app(s) skipped"
  sync0408: # cleanup
    command: sh -c 'id=$(cat sync111_id.tmp); ../openrun sync delete "$id" && rm -f sync111_id.tmp'
    stdout: "deleted"
  sync0409:
    command: ../openrun app delete /sync111/app && rm -f /tmp/sync_111.ace
    stdout: "app(s) deleted"
