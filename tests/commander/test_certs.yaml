config:
  env:
    CL_CONFIG_FILE: openrun.toml
    GOCOVERDIR: ${GOCOVERDIR}/../client
    MAIN_HTTP_PORT: ${MAIN_HTTP_PORT}
    MAIN_HTTPS_PORT: ${MAIN_HTTPS_PORT}
tests:
  certs010: ## create test1 app
    command: ../openrun app create --auth cert_test1 ./testapp /certs_test1
  certs020: ## create test2 app
    command: ../openrun app create --auth cert_test2 ./testapp /certs_test2
  certs030: ## test auth1 with key a
    command: curl -k --cert certs/testcerts1/client.a.crt --key certs/testcerts1/client.a.key https://localhost:${MAIN_HTTPS_PORT}/certs_test1
    stdout: Test app body
  certs040: ## test auth1 with key b
    command: curl -k --cert certs/testcerts1/client.b.crt --key certs/testcerts1/client.b.key https://localhost:${MAIN_HTTPS_PORT}/certs_test1
    stdout: Test app body
  certs050: ## test auth2 with key a
    command: curl -k --cert certs/testcerts2/client.a.crt --key certs/testcerts2/client.a.key https://localhost:${MAIN_HTTPS_PORT}/certs_test2
    stdout: Test app body
  certs060: ## test auth2 with key b
    command: curl -k --cert certs/testcerts2/client.b.crt --key certs/testcerts2/client.b.key https://localhost:${MAIN_HTTPS_PORT}/certs_test2
    stdout: Test app body
  certs070: ## test auth1 with test2 key a, fails
    command: curl -k --cert certs/testcerts2/client.a.crt --key certs/testcerts2/client.a.key https://localhost:${MAIN_HTTPS_PORT}/certs_test1
    stdout: client certificate verification failed
  certs080: ## test auth2 with test1 key a, fails
    command: curl -k --cert certs/testcerts1/client.a.crt --key certs/testcerts1/client.a.key https://localhost:${MAIN_HTTPS_PORT}/certs_test2
    stdout: client certificate verification failed
  certs090: ## no key fails
    command: curl -k https://localhost:${MAIN_HTTPS_PORT}/certs_test1
    stdout: client certificate required
  certs100: ## http fails
    command: curl http://localhost:${MAIN_HTTP_PORT}/certs_test1
    stdout: client certificate required
  certs110: ## update app1 to use auth2
    command: ../openrun app update auth --promote  cert_test2 /certs_test1
  certs120: ## test auth1 with auth1 key a, fails now
    command: curl -k --cert certs/testcerts1/client.a.crt --key certs/testcerts1/client.a.key https://localhost:${MAIN_HTTPS_PORT}/certs_test1
    stdout: client certificate verification failed
  certs130: ## test auth1 with auth2 key a, works
    command: curl -k --cert certs/testcerts2/client.a.crt --key certs/testcerts2/client.a.key https://localhost:${MAIN_HTTPS_PORT}/certs_test1
    stdout: Test app body
  certs140: ## update app1 to no auth
    command: ../openrun app update auth --promote  none /certs_test1
  certs150: ## no key works
    command: curl -k https://localhost:${MAIN_HTTPS_PORT}/certs_test1
    stdout: Test app body
  certs160: ## http works
    command: curl http://localhost:${MAIN_HTTP_PORT}/certs_test1
    stdout: Test app body
  certs170: ## invalid conf fails
    command: ../openrun app update auth --promote  cert_invalid /certs_test1
    exit-code: 1
    stderr: invalid authentication type cert_invalid
  certs200: ## app on a local dev domain, gets a mkcert cert
    command: ../openrun app create --auth none ./testapp certsapp.localhost:/
  certs210: ## app on a domain not in https.mkcert_domains, mkcert is not used
    command: ../openrun app create --auth none ./testapp certsapp.example.com:/
  certs215: ## app on a non local domain listed in https.mkcert_domains
    command: ../openrun app create --auth none ./testapp mkcert.example.com:/
  certs220: ## configured local domain is served the mkcert cert
    command: openssl s_client -connect localhost:${MAIN_HTTPS_PORT} -servername certsapp.localhost </dev/null 2>/dev/null | openssl x509 -noout -text
    stdout: DNS:certsapp.localhost
  certs225: ## domain listed in https.mkcert_domains is served the mkcert cert
    command: openssl s_client -connect localhost:${MAIN_HTTPS_PORT} -servername mkcert.example.com </dev/null 2>/dev/null | openssl x509 -noout -text
    stdout: DNS:mkcert.example.com
  certs230: ## domain not in https.mkcert_domains, without cert files, gets the default cert
    command: openssl s_client -connect localhost:${MAIN_HTTPS_PORT} -servername certsapp.example.com </dev/null 2>/dev/null | openssl x509 -noout -subject -nameopt RFC2253
    stdout: O=OpenRun Server
  certs240: ## unconfigured domain gets the default cert
    command: openssl s_client -connect localhost:${MAIN_HTTPS_PORT} -servername unknown.localhost </dev/null 2>/dev/null | openssl x509 -noout -subject -nameopt RFC2253
    stdout: O=OpenRun Server
  certs250: ## path traversal in the server name gets the default cert
    command: openssl s_client -connect localhost:${MAIN_HTTPS_PORT} -servername 'https://x/../../../sni_escape' </dev/null 2>/dev/null | openssl x509 -noout -subject -nameopt RFC2253
    stdout: O=OpenRun Server
  certs260: ## mkcert flag in the server name gets the default cert
    command: openssl s_client -connect localhost:${MAIN_HTTPS_PORT} -servername -install </dev/null 2>/dev/null | openssl x509 -noout -subject -nameopt RFC2253
    stdout: O=OpenRun Server
  certs270: ## traversal did not write files outside the cert location
    command: test ! -e config/sni_escape.crt && test ! -e config/sni_escape.key
  certs280: ## mkcert ran only for served domains matching https.mkcert_domains
    command: cat config/certificates/mkcert_calls.log
    stdout:
      contains:
        - certsapp.localhost
        - mkcert.example.com
      not-contains:
        - certsapp.example.com
        - unknown.localhost
        - sni_escape
        - install
  certs290: ## cleanup
    command: ../openrun app delete certsapp.localhost:/ && ../openrun app delete certsapp.example.com:/ && ../openrun app delete mkcert.example.com:/
