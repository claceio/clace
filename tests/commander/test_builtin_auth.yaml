config:
  env:
    CL_CONFIG_FILE: openrun.toml
    GOCOVERDIR: ${GOCOVERDIR}/../client
    MAIN_HTTP_PORT: ${MAIN_HTTP_PORT}
    MAIN_HTTPS_PORT: ${MAIN_HTTPS_PORT}
tests:
  builtin0010: # create an app with builtin user/password auth
    command: ../openrun app create --auth=builtin ./rbac_child_app /builtin_app
    stdout: "App: /builtin_app"
    exit-code: 0
  builtin0020: # no credentials - 401
    command: curl -s -o /dev/null -w "%{http_code}" localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "401"
    exit-code: 0
  builtin0030: # static openrun.toml user can log in
    command: curl -s -u statictester:abcd localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "child ok"
    exit-code: 0
  builtin0040: # wrong password - 401
    command: curl -s -u statictester:wrong -o /dev/null -w "%{http_code}" localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "401"
    exit-code: 0
  builtin0050: # unknown user - 401
    command: curl -s -u nosuchuser:abcd -o /dev/null -w "%{http_code}" localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "401"
    exit-code: 0
  builtin0060: # enable RBAC. builtin users are granted access by user id
    # (builtin:<username>) or by group (group: matches the user entry's groups)
    command: |
      cat > builtin_rbac.json <<EOF
      {
        "version_id": "force",
        "rbac": {
          "groups": {},
          "roles": {
            "viewer": ["app:access"]
          },
          "grants": [
            {
              "description": "statictester views builtin_app",
              "users": ["builtin:statictester"],
              "roles": ["viewer"],
              "targets": ["/builtin_app"]
            },
            {
              "description": "devs group views builtin_app",
              "users": ["group:devs"],
              "roles": ["viewer"],
              "targets": ["/builtin_app"]
            }
          ]
        }
      }
      EOF
      ../openrun server update-config --force builtin_rbac.json
    exit-code: 0
  builtin0070: # statictester allowed through the builtin:statictester user id grant
    command: curl -s -u statictester:abcd localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "child ok"
    exit-code: 0
  builtin0080: # add a dynamic user in the devs group, no server restart needed
    command: ../openrun user add testuser1 --value password1 --groups devs,qa
    stdout: "User added: testuser1"
    exit-code: 0
  builtin0090: # testuser1 allowed through the group:devs grant
    command: curl -s -u testuser1:password1 localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "child ok"
    exit-code: 0
  builtin0100: # adding an existing user fails
    command: ../openrun user add testuser1 --value password1
    stderr: "already exists"
    exit-code: 1
  builtin0110: # updating a missing user fails
    command: ../openrun user update nosuchuser --value password1
    stderr: "does not exist"
    exit-code: 1
  builtin0120: # list shows the imported static user and the new user with groups
    command: ../openrun user list
    stdout:
      contains:
        - "statictester"
        - "static-group"
        - "testuser1"
        - "devs,qa"
        - "active"
    exit-code: 0
  builtin0122: # show one user
    command: ../openrun user show testuser1 --format json
    stdout:
      contains:
        - '"username": "testuser1"'
        - '"disabled": false'
        - '"created_by": "admin"'
    exit-code: 0
  builtin0124: # the password policy is enforced by the server
    command: ../openrun user add shortpw --value abc
    stderr: "at least 8 characters"
    exit-code: 1
  builtin0126: # reserved usernames are refused
    command: ../openrun user add admin --value password1
    stderr: "reserved"
    exit-code: 1
  builtin0130: # change the password, groups are kept
    command: ../openrun user update testuser1 --value password2
    stdout: "User updated: testuser1"
    exit-code: 0
  builtin0140: # the old password stops working immediately
    command: curl -s -u testuser1:password1 -o /dev/null -w "%{http_code}" localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "401"
    exit-code: 0
  builtin0150: # the new password works, groups were kept (group:devs grant)
    command: curl -s -u testuser1:password2 localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "child ok"
    exit-code: 0
  builtin0160: # update the groups only, password is kept
    command: ../openrun user update testuser1 --groups qa
    stdout: "User updated: testuser1"
    exit-code: 0
  builtin0170: # no longer in devs - authenticated but not authorized (403)
    command: curl -s -u testuser1:password2 -o /dev/null -w "%{http_code}" localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "403"
    exit-code: 0
  builtin0172: # disable the user: authentication is refused (401)
    command: ../openrun user update testuser1 --disable
    stdout: "User updated: testuser1"
    exit-code: 0
  builtin0174: # a disabled user cannot log in even with the right password
    command: curl -s -u testuser1:password2 -o /dev/null -w "%{http_code}" localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "401"
    exit-code: 0
  builtin0176: # the state shows in the listing
    command: ../openrun user list
    stdout:
      contains:
        - "disabled"
    exit-code: 0
  builtin0178: # enable again, and the user is back (403: authenticated, not in devs)
    command: |
      ../openrun user update testuser1 --enable > /dev/null
      curl -s -u testuser1:password2 -o /dev/null -w "%{http_code}" localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "403"
    exit-code: 0
  builtin0179: # ten wrong passwords lock the account; the right password is then refused until unlocked
    command: |
      for i in $(seq 1 10); do curl -s -u testuser1:wrongpass -o /dev/null localhost:${MAIN_HTTP_PORT}/builtin_app/; done
      curl -s -u testuser1:password2 -o /dev/null -w "%{http_code}\n" localhost:${MAIN_HTTP_PORT}/builtin_app/
      ../openrun user show testuser1 | grep -c locked
      ../openrun user update testuser1 --unlock > /dev/null
      curl -s -u testuser1:password2 -o /dev/null -w "%{http_code}\n" localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout:
      exactly: |
        401
        1
        403
    exit-code: 0
  builtin0180: # delete the dynamic user
    command: ../openrun user delete testuser1
    stdout: "User deleted: testuser1"
    exit-code: 0
  builtin0190: # the deleted user can no longer authenticate (401)
    command: curl -s -u testuser1:password2 -o /dev/null -w "%{http_code}" localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "401"
    exit-code: 0
  builtin0200: # the user imported from the static openrun.toml entry is an ordinary user: it can be deleted
    command: ../openrun user delete statictester
    stdout: "User deleted: statictester"
    exit-code: 0
  builtin0205: # and is gone until the next server start re-imports it
    command: curl -s -u statictester:abcd -o /dev/null -w "%{http_code}" localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "401"
    exit-code: 0
  builtin0210: # restore the default RBAC config (RBAC is always on; the
    # default grant gives every authenticated principal app access)
    command: |
      cat > builtin_rbac.json <<EOF
      {
        "version_id": "force",
        "rbac": {
          "groups": {},
          "roles": {},
          "grants": [
            {
              "description": "Default: authenticated principals can access and list apps",
              "users": ["*"],
              "roles": ["openrun-user"],
              "targets": ["all"]
            }
          ]
        }
      }
      EOF
      ../openrun server update-config --force builtin_rbac.json
    exit-code: 0
  builtin0215: # users live in their own table: replacing the dynamic config does not touch them
    command: |
      ../openrun user add testuser2 --value password2 > /dev/null
      ../openrun user list | grep -c testuser2
    stdout: "1"
    exit-code: 0
  builtin0220: # with the default grant, any builtin user can access the app
    command: curl -s -u testuser2:password2 localhost:${MAIN_HTTP_PORT}/builtin_app/
    stdout: "child ok"
    exit-code: 0
  builtin0225: # a dynamic config document carrying a builtin_auth section is rejected
    command: |
      cat > builtin_bad.json <<EOF
      {"version_id": "force", "rbac": {"groups": {}, "roles": {}, "grants": [{"users": ["*"], "roles": ["openrun-user"], "targets": ["all"]}]},
       "entries": {"builtin_auth": {"sneaky": {"password": "x", "groups": []}}}}
      EOF
      ../openrun server update-config --force builtin_bad.json
    stderr: "builtin_auth"
    exit-code: 1
  builtin0230: # cleanup app, user and config files
    command: |
      ../openrun user delete testuser2
      ../openrun app delete /builtin_app
      rm -f builtin_rbac.json builtin_bad.json
    exit-code: 0
