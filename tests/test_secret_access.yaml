config:
  env:
    CL_CONFIG_FILE: openrun.toml
    HTTP_PORT: ${HTTP_PORT}
    GOCOVERDIR: ${GOCOVERDIR}/../client
    OPENRUN_CONTAINER_COMMAND: ${OPENRUN_CONTAINER_COMMAND}
    PATH: ${PATH}
tests:
  # The server runs with the default permissions: the container config call is
  # allowed without secrets. An app declaring secrets deploys without approval
  # but cannot resolve them until approved (github issue #105 scenario)
  secret_access0010: # setup app: the index page says whether MY_SECRET reached the container
    command: |
      rm -rf ./secret_access_app && mkdir secret_access_app && cat > secret_access_app/Dockerfile <<'EOF'
      FROM busybox:1.36
      EXPOSE 8080
      CMD mkdir -p /www && if [ -n "$MY_SECRET" ]; then echo "MY_SECRET is set to $MY_SECRET"; else echo "MY_SECRET is not set"; fi > /www/index.html && exec httpd -f -p 8080 -h /www
      EOF
  secret_access0020: # the spec declares no secret access by default, no approval and no warning
    command: ../openrun app create --spec container ./secret_access_app /secrettest
    stdout:
      contains:
        - "App created. No approval required"
    stderr:
      not-contains:
        - "warning:"
  secret_access0030: # create the secret in the db provider
    command: ../openrun secret create --name sa_secret --value s3cret
  secret_access0040: # a param referencing a secret warns: the app has no secret access
    command: ../openrun param update --promote MY_SECRET '{{secret_from "db" "sa_secret"}}' /secrettest
    stdout:
      contains:
        - "Updated app stage.localhost:/secrettest"
    stderr:
      contains:
        - "warning: app /secrettest: the new value references secrets, but the app has no secret access for container.in.config"
        - "--param secrets="
        - "openrun app approve /secrettest"
  secret_access0050: # the container does not start, the error says how to fix it
    command: curl -sS localhost:${HTTP_PORT}/secrettest/
    stdout:
      contains:
        - "error evaluating secret in param MY_SECRET"
        - "no secret access"
        - "openrun app approve /secrettest"
  secret_access0055: # the stage app (domain based staging) names the main app path to approve
    command: 'curl -sS -H "Host: stage.localhost" localhost:${HTTP_PORT}/secrettest/'
    stdout:
      contains:
        - "error evaluating secret in param MY_SECRET"
        - "openrun app approve /secrettest`"
  secret_access0060: # declaring the access through the secrets param warns that approval is needed
    command: ../openrun param update --promote secrets '[["sa_secret"]]' /secrettest
    stdout:
      contains:
        - "Updated app stage.localhost:/secrettest"
    stderr:
      contains:
        - "warning: app /secrettest: the app declares secret access which is not approved: container.in.config auto secrets=sa_secret"
        - "openrun app approve /secrettest"
  secret_access0070: # still not approved: the secret is not resolved
    command: curl -sS localhost:${HTTP_PORT}/secrettest/
    stdout:
      contains:
        - "error evaluating secret in param MY_SECRET"
        - "openrun app approve /secrettest"
  secret_access0080: # approve records the declared secrets and says so
    command: ../openrun app approve /secrettest
    stdout:
      contains:
        - "App permissions have been approved stage.localhost:/secrettest "
        - "container.in.config [auto]"
        - "secrets=sa_secret"
        - "1 app(s) audited, 1 app(s) approved, 0 app(s) promoted."
  secret_access0090: # promote the approval
    command: ../openrun app promote /secrettest
    stdout: "1 app(s) promoted"
  secret_access0100: # the secret resolves
    command: curl -sS localhost:${HTTP_PORT}/secrettest/
    stdout: "MY_SECRET is set to s3cret"
  secret_access0110: # a repeat approve reports nothing to approve
    command: ../openrun app approve /secrettest
    stdout:
      contains:
        - "No approval required. stage.localhost:/secrettest "
        - "1 app(s) audited, 0 app(s) approved, 0 app(s) promoted."
  secret_access0120: # a secret outside the approved patterns: the app has access, so no advisory
    command: ../openrun param update --promote MY_SECRET '{{secret_from "db" "other_secret"}}' /secrettest
    stderr:
      not-contains:
        - "warning:"
  secret_access0130: # the secret is refused at runtime, with the fix
    command: curl -sS localhost:${HTTP_PORT}/secrettest/
    stdout:
      contains:
        - "not allowed to access the secret"
        - "openrun app approve /secrettest"
  secret_access0140: # create declaring secrets without approve: deploys with a warning
    command: ../openrun app create --spec container --param secrets='[["regex:.*"]]' ./secret_access_app /secrettest2
    stdout:
      contains:
        - "App created. No approval required"
    stderr:
      contains:
        - "warning: app /secrettest2: the app declares secret access which is not approved: container.in.config auto secrets=regex:.*"
        - "openrun app approve /secrettest2"
  secret_access0150: # reload without approve repeats the warning
    command: ../openrun app reload --force-reload /secrettest2
    stdout:
      contains:
        - "Audited apps:"
        - "1 app(s) reloaded, 0 app(s) skipped, 0 app(s) approved, 0 app(s) promoted."
    stderr:
      contains:
        - "warning: app /secrettest2: the app declares secret access which is not approved"
  secret_access0160: # reload with approve records the access and counts it
    command: ../openrun app reload --force-reload --approve --promote /secrettest2
    stdout:
      contains:
        - "App permissions have been approved stage.localhost:/secrettest2 "
        - "2 app(s) reloaded, 0 app(s) skipped, 1 app(s) approved, 1 app(s) promoted."
    stderr:
      not-contains:
        - "warning:"
  secret_access0170: # the approved app resolves the secret
    command: ../openrun param update --promote MY_SECRET '{{secret_from "db" "sa_secret"}}' /secrettest2
    stderr:
      not-contains:
        - "warning:"
  secret_access0180: # check
    command: curl -sS localhost:${HTTP_PORT}/secrettest2/
    stdout: "MY_SECRET is set to s3cret"
  secret_access0190: # create with approve records the access with no warning
    command: ../openrun app create --spec container --approve --param secrets='[["regex:.*"]]' ./secret_access_app /secrettest3
    stdout:
      contains:
        - "App created. Permissions have been approved"
    stderr:
      not-contains:
        - "warning:"
  secret_access0200: # cleanup apps
    command: ../openrun app delete "/secrettest*"
  secret_access0210: # cleanup secret
    command: ../openrun secret delete sa_secret
